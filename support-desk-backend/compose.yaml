services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in support-desk-backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - supportdesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk -d supportdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supportdesk-postgres:
